# 排除准则机读版（处置标签 X 的子类）
# 来源：v2_方案.md §5.12、constraints.md HC-09、§17.2 勘误 #10（X5 亲密关系）

version: "1.0"

sources:
  - "spec/v2_方案.md §5.12"
  - "spec/constraints.md HC-09"
  - "spec/v2_方案.md §17.2 勘误 #10"

judgment:
  when: "读完「单元卡 + 首尾段」之后方可判定排除；不得因「不重要」「太长」而排除（R10）。"
  disposition_tag: X
  required_fields:
    - subcode
    - reason
    - has_transferable_methodology  # 台账字段；含可迁移方法论时须登记

global:
  transferable_methodology_exception:
    applies_to: [X2, X3, X4, X5, X6]
    rule: "单元属上述子类但含可迁移方法论时，只抽取方法论入主干/卡片，其余排除登记。"
  default_exclude_user_pullback:
    description: "游记、移民等内容默认按排除处理；用户可点名拉回纳入精读或主干。"
    typical_subcodes: [X3]
    note: "移民类若含可迁移判断，仍先走可迁移方法论例外；是否整体拉回由用户点名决定（§15.12）。"
  hc_09_summary: "不作支柱：宏观、科技趋势、文明史、教育制度与升学与家庭与亲密关系；读者来信原文与第三方无评述引文排除；含可迁移方法论的只抽方法论。"

exclusions:
  X1:
    name: 载体与非内容
    description: >
      目录、导航、推广、出版信息、新书推荐、彩蛋、投票、招募等承载形态或运营性内容，
      不构成可归属支柱的论点主体。与结构类单元（标签 N）有交集时，按 G9 处置四向与单元类型字段区分登记。
    examples:
      - 自动目录、作者自编目录（参照单元 N3 对账用，不进手册主干）
      - 发刊词中的招募、投票、彩蛋
      - 出版信息、新书推荐、导航性前言
    exception_for_transferable_methodology: null

  X2:
    name: 时事与时点论断
    description: >
      依赖特定年代、事件、行情、标的或时点的判断与预测；时效论断不入手册主干，
      须标稳定度（含年代）。可迁移的判断逻辑可抽取后归属判断决策或商业等支柱。
    examples:
      - 具体行情、标的、买卖时点建议
      - 对当时政策、地缘、行业事件的时点性结论
      - 来信中对「当下」新闻的评论（无长期机制部分）
    exception_for_transferable_methodology: >
      提炼可迁移的判断逻辑（机制、框架、条件与例外），标稳定度；时效论断本身不入主干。

  X3:
    name: 游记与旅行
    description: >
      以旅行见闻、地点记叙为主的单元；默认排除。移民、Relocation 类叙述视同默认排除范围，
      用户可点名拉回。纯见闻无判断的叙述记 C 或 X8，有判断的按「经历→可迁移判断」再判。
    examples:
      - 旅行游记、景点见闻为主的篇目
      - 移民经历叙述（默认排除，可点名拉回）
      - 纯个人轶事式旅途记录（无机制/方法）
    exception_for_transferable_methodology: 含可迁移方法论则只抽方法论，其余排除登记。

  X4:
    name: 纯史实科普
    description: >
      大学史、货币史、瓷器史、人物传记、航天史、数学史公案等史实陈述与科普叙述；
      史实作证据挂靠（C），不作 K 论点。整体排除，仅保留吴军给出的可迁移方法论或评述。
    examples:
      - 数学家/哲学家生平与思想史科普（无吴军方法提炼）
      - 《数学史上的公案——无理数》类史实篇
      - 公司史、发明史、技术史纯叙述
    exception_for_transferable_methodology: >
      排除史实主体；仅留可迁移方法论（沿用用户既有决定）。哲学家生平等只留吴军可迁移评述。

  X5:
    name: 教育制度、升学、家庭与亲密关系
    description: >
      教育制度、升学路径、高考、大学与专业选择、家庭教育制度讨论，以及爱情、婚姻、亲子等亲密关系议题。
      用户已定此类内容暂不需要、不作支柱。友情与社交不在此列，按结论句归为人处世与组织协同（D07-2）。
      「如何学习」类方法论（获取、消化、记忆、迁移知识）不按 X5，按边界规则⑪归个人成长·如何学习（D02-2）。
    examples:
      - 高考、大学、升学、选专业
      - 爱情、婚姻、亲子、快乐教育中的制度/家庭选择
      - 教育改变命运、教育制度类宏观叙述（制度面归 X5；宏观面也可能触 X6）
    exception_for_transferable_methodology: >
      含可迁移方法论时只抽方法论；「如何学习」操作化方法归 D02-2（规则⑪），不归 X5。
    errata:
      - "v2 §17.2 #10：原 §5.12 表格未写「亲密关系」，已补入爱情、婚姻、亲子，并注明友情与社交归 D07-2。"

  X6:
    name: 宏观经济、科技趋势、文明历史
    description: >
      宏观经济、行业/科技趋势预测、文明与世界历史、国家科研体制等视野类内容；
      用户已定不作支柱。可迁移的判断逻辑可归判断决策（D03）或商业（D08）等。
    examples:
      - 宏观经济、收入分配、国家层面政策论述
      - AI 与科技趋势预测、智能时代叙事
      - 文明史、世界历史、国家科研体制
    exception_for_transferable_methodology: >
      可迁移的判断逻辑抽取后归属判断决策或商业；趋势预测与时效论断主体仍标 X2/X6 排除。

  X7:
    name: 读者来信原文与第三方引文
    description: >
      读者来信原文、第三方大段引文且无吴军评述的段落；不进「原著核心判断」。
      吴军对来信/第三方的回应或评述须单独抽取，并标说话人（说话人先行，HC-10）。
    examples:
      - 读者提问或陈述原文（无吴军评点）
      - 大段第三方引文且无吴军转述/评点
    exception_for_transferable_methodology: >
      不适用「只抽方法论」通用句式；吴军的回应、评述、转述单独成卡，标说话人，按结论句归属。

  X8:
    name: 其他
    description: >
      无法归入 X1–X7 但仍决定排除的单元；须逐条写明理由，并纳入抽样复核（G10、台账字段）。
      排除有争议时暂记 X8 并问用户（§15.12）。
    examples:
      - 医学与心理疾病诊断类（非吴军方法框架）
      - 文学人物纯赏析、无迁移判断的篇目
      - 具体产品评测与技术细节（无通用方法结论）
      - 争议性排除（游记/移民/教育家庭是否保留等）
    exception_for_transferable_methodology: >
      若含可迁移方法论，优先尝试归入 X2–X6 并套用对应例外；仍无法归类时记 X8 并注明方法论抽取去向。
