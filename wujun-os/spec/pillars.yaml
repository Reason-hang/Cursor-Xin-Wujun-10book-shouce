        include: 商业的本质；经营与管理的秘诀；共享、跟踪、合作、众筹等商业模式；平台；竞争与垄断；创业者建议与创业成败；大企业与小公司；蚂蚁战胜大象（商业层面）
        exclude_routing: "做出新产品的方法、判断技术与产品前景 → D10；个人投资 → D09；企业史、人物史 → X4；宏观经济与行业趋势预测 → X6 或 X2；具体公司事件 → X2。领域直连内容（跨境、电商、物流、供应链）按结论句归属并加\"领域直连\"标记，不单设簇"
