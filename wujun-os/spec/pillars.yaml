# 支柱定义字典机读版
# source: v2_方案.md §13（执行基线 v1.0）
---
version: v1.0
source: v2_方案.md §13 支柱定义字典（执行基线 v1.0）
pillars:
  -
    code: D01
    name: 认知格局与境界哲学
    category: 对内
    focus: true
    one_line_definition: 如何认识世界、如何思考，以及看事情的尺度、层次与哲学视角
    core_question: 我怎样才能想得更清楚、看得更远、站得更高？
    criteria_conclusion_test: "结论句回答\"世界、知识、思考是怎样的，该怎样认识与思考\"，或\"看事情应取什么尺度、什么层次\""
    neighbor_rules:
      - ④″
      - ⑦
      - ⑩
    l2_children:
      -
        code: D01-1
        name: 认知·如何思考（理性与科学方法）
        definition: 如何认识世界、获得新知、判断真伪、进行思考，含理性与科学方法。问：我怎样想才不被误导、得出可靠的结论？
        include: 如何知道所见非虚；理性主义与经验主义的含义和局限；何时用经验、何时信理性；推理类型（含充分性推理）与逻辑的预见性；发现真理的系统方法；证伪与怀疑；辨别信息真假、走出认知的洞穴；用逻辑过滤信息和结论；思维方式的训练
        exclude_routing: 数学、计算机、工程的原理与方法 → D04（⑩）；面对具体选择的取舍 → D03（⑦）；学习方法 → D02-2；哲学家学说本身 → D01-4
        caliber: "结论句讲\"怎样认识、推理、判真伪、选思维框架\"归本簇；通用推理归本簇，数学原理归 D04-1。\"经历与经验\"类按 §13.4 第 5 行判定"
        capability_tags:
          - 思
      -
        code: D01-2
        name: 格局
        definition: 看事情的尺度、视野与取舍的大局观（工作定义，P1 校准）。问：我怎样站在更大的尺度上看事情、做取舍？
        include: 大局与小利、小恶与大善的权衡；决策时的格局；主动、分享利益与独立判断的格局观；眼光、高度与量级之差
        exclude_routing: 具体选择的取舍判断 → D03-1；职场沟通与职业技巧 → D06；交友与合作方法 → D07-2；未来趋势预测 → X6
        caliber: "结论句讲\"应取多大尺度、多高层次、大局与小利\"归本簇；讲\"做或不做某具体事\"归 D03-1；与 D07-2 在\"分享利益\"上按结论句分"
        capability_tags:
          - 思
      -
        code: D01-3
        name: 境界
        definition: 认知与精神的层次、人生维度，以及超越庸常的路径（工作定义，P1 校准）。问：怎样提升认知与人生的层次？
        include: "什么是境界；了解自己与世界（自我的边界、对灵魂问题的吴军评述）；做事的境界；超越庸常生活成为\"更高的人\"（吴军对其的取用）"
        exclude_routing: 尼采等第三方思想本身 → D01-4；心态与幸福 → D02-4；具体做事方法 → D05
        caliber: "结论句讲\"认知与人生所处的层次、如何提升\"归本簇；第三方思想本身归 D01-4，吴军对其取用归本簇"
        capability_tags:
          - 思
      -
        code: D01-4
        name: 哲学
        definition: "哲学思想与流派，以及吴军对其的评述与取用。说话人多为\"转述·第三方\"。问：这些思想说了什么，吴军如何评价并取用？"
        include: 理性主义、经验主义、尼采、维特根斯坦、亚里士多德、苏格拉底、庄子、伊壁鸠鲁、吠陀文化、叔本华等的思想要点（转述）及吴军的评述；哲学的作用与边界
        exclude_routing: 哲学家生平与思想史科普 → X4（只留吴军评述）；吴军自己的认知方法 → D01-1；文学人物智慧（如莎士比亚）→ 先写结论句再归属，纯赏析 → X8
        caliber: "说话人为\"转述·第三方\"的内容只进卡的\"转述\"字段，**不进\"原著核心判断\"**；入主干的只能是吴军的评述与取用"
        capability_tags:
          - 思
  -
    code: D02
    name: 个人成长与世界观/人生观/价值观
    category: 对内
    focus: true
    one_line_definition: 一个人如何成长、学习，如何形成、校准并安放三观，如何保持心态与幸福
    core_question: 我怎样成为什么样的人，并把自己安放好？
    criteria_conclusion_test: "结论句回答\"我经历了什么、怎样形成和校准信念与价值、怎样安放自己与保持状态、怎样学\""
    neighbor_rules:
      - ①
      - ④″
      - ⑧
      - ⑪
    l2_children:
      -
        code: D02-1
        name: 成长经历与心路
        definition: 吴军本人及其所述人物的成长经历、阶段选择与心路中可迁移的判断。问：经历怎样塑造了判断，我能迁移什么？
        include: "\"经历 → 判断\"的论述（恩师、读书、写书心得、人生感悟、阶段选择）；把经历变成经验的方法"
        exclude_routing: 纯个人轶事、游记 → X3 或 X8；如何做复盘 → D05-2；经验与理性的关系 → D01-1；家庭与亲子 → X5
        caliber: "**只收\"经历 → 可迁移判断\"**；没有判断的纯叙述不成 K 卡，记 C 或 X8"
        capability_tags:

      -
        code: D02-2
        name: 如何学习（学习方法）
        definition: "如何获取、消化、记忆、迁移知识的方法；不含教育制度与\"为什么学\"。问：我怎样学得更有效？"
        include: 手先于脑与脑先于手的学习、信息学习与传递的效率、读书与阅读的方法、学以致用、数学该怎么学（方法层面）、跳出问题看问题（学习方法层面）
        exclude_routing: 为什么学、学什么、读书的意义 → D02-1 或 D02-3（⑪）；教育制度、升学、大学与专业选择 → X5（含方法论例外）；通用思考方法 → D01-1
        caliber: "结论句讲\"怎样学、怎样提高学习效率\"归本簇"
        capability_tags:
          - 学
      -
        code: D02-3
        name: 三观的形成、校准与安放
        definition: 世界观、人生观、价值观的形成、校准与安放：我信什么、什么重要、怎样看命运与运气、怎样活。问：我的信念与价值怎样形成、校准、安放？
        include: 价值观（含做人原则、问心无愧）；人生观（人生是一条河、向死而生、人生最重要的投资）；命运观（命与运、尽人事听天命、对运气的看法）；意义；金钱以外的价值取舍；个人所持的世界信念
        exclude_routing: 世界运行逻辑与认识方法 → D01；金钱观中的财富管理 → D09-1；把运气或概率当决策输入 → D03-2；教育改变命运类 → X5
        caliber: "本簇的\"世界观\"指**个人所持的信念及其校准**，与 D01 的\"认识世界的方法\"区分（④″）。命运观与概率决策见 §13.4 第 11 行"
        capability_tags:

      -
        code: D02-4
        name: 心态韧性与幸福生活
        definition: 情绪、压力、逆境下的状态稳定，乐观与悲观，以及幸福与生活节奏。问：怎样在压力与逆境中保持状态、过得幸福？
        include: 乐观的人生态度、幸福的来源与含义、抵制诱惑的定力、悲观主义的盛行与危害、怀旧、休息与生活节奏、幸福的蓝色地带、不选择的幸福、快乐
        exclude_routing: 如何把事做成 → D05；人生价值与意义 → D02-3；医学与心理疾病诊断类 → X8；亲子教育中的快乐教育 → X5
        caliber: "结论句讲\"状态稳定、乐观悲观、幸福\"归本簇（⑧）"
        capability_tags:

  -
    code: D03
    name: 判断决策与风险止损
    category: 对内
    focus: false
    one_line_definition: 面对具体选择时做什么、不做什么，以及风险、概率与止损
    core_question: 这件事我该不该做、选哪个、何时停？
    criteria_conclusion_test: "结论句回答\"做不做、选哪个、何时停、承担多大风险\""
    neighbor_rules:
      - ②
      - ⑦
    l2_children:
      -
        code: D03-1
        name: 决策框架与取舍
        definition: 面对具体选择时，做什么、不做什么的判断框架与取舍。问：这件事该不该做、选哪个、先做哪个？
        include: 决策前考虑成本；让回报大于成本；机会成本；做减法的取舍判断；西瓜与芝麻；优先级取舍（最重要的事先做）；体量与取舍；选择与不做选择
        exclude_routing: 确定做之后怎么做 → D05（②）；风险、概率、止损 → D03-2；格局层面的大局观 → D01-2；价值观层面的人生取舍 → D02-3
        caliber: "结论句含\"做、不做、选哪个、先后\"归本簇；\"做减法\"按主干判（回归组 b）"
        capability_tags:
          - 思
      -
        code: D03-2
        name: 风险、止损与概率思维
        definition: 风险意识、止损、概率与大概率判断、不确定性下的决策。问：该承担多大风险、何时止损、怎样看待概率？
        include: 期望值最大化与收益函数；风险意识；承担多大风险；止损（含时间管理中的止损）；大概率事件与黑天鹅的决策含义；不确定性下的取舍；做事前不要过分算概率；决策层面的红线
        exclude_routing: 概率与统计的数学原理 → D04-1；投资的具体风险与红线 → D09-2；命运观 → D02-3；保险与金融产品细节 → D09-2 或 X8
        caliber: "结论句讲\"风险、止损、把概率用于决策\"归本簇；讲概率本身的数学规律归 D04-1"
        capability_tags:
          - 思
  -
    code: D04
    name: 数理与计算机思维与工程思维
    category: 对内
    focus: false
    one_line_definition: 数学、计算机、工程的原理与思维方式本身
    core_question: 这些学科的思维方式是什么，它说明了什么规律？
    criteria_conclusion_test: "结论句讲\"某学科的原理或思维方式本身\"；讲\"怎么做事\"归 D05，讲\"怎么选\"归 D03"
    neighbor_rules:
      - ③
      - ⑩
    l2_children:
      -
        code: D04-1
        name: 数学思维与极限
        definition: 数学的原理与思维方式本身：极限、无穷、数列级数、函数、微积分、线性代数、概率统计、博弈论等，及其说明的规律。问：数学思维说明了什么规律？
        include: 用数学思维认识世界的原理层（负数、乘方、线性增长的局限、杠杆、级数与利息月供）；极限与无穷小；函数与因果；向量与维度；微积分；概率与统计原理；零和与非零和博弈原理；数学与哲学、逻辑、科学的关系
        exclude_routing: 概率用于决策 → D03-2；用数学工具做事的步骤 → D05；数学史、数学家轶事 → X4（保留可迁移方法论）；把数学类比到生活取舍 → 按结论句判（讲原理归本簇，讲取舍归 D03）
        caliber: "结论句讲\"数学的某个原理或规律\"归本簇"
        capability_tags:
          - 思
      -
        code: D04-2
        name: 计算机思维
        definition: 计算机与信息领域的思维方式：算法、搜索、数据、信息、量级、计算的局限，及其说明的规律。问：计算机思维是什么，它说明了什么规律？
        include: 计算机思维的含义；算法与效率的本质；搜索与数据；信息与比特；计算的局限（计算机不是万能）；机器与人的分工；数据资产（技术层面）
        exclude_routing: "在工作场景中怎么用计算机思维做事 → D05-1，加辅助标签[计算机]；AI 与科技趋势预测 → X6；技术史 → X4；具体产品评测与技术细节 → X8"
        caliber: "结论句讲\"计算机或信息领域的原理与思维方式本身\"归本簇，类比规则③"
        capability_tags:
          - 思
      -
        code: D04-3
        name: 工程思维
        definition: 工程的原理与思维方式：极限、误差、基线、系统性、奥卡姆剃刀、试错、精度。问：工程思维的原理是什么？
        include: 工程思维：直觉和极限；极限与误差；基线与连接路径的概念本身；系统思维；奥卡姆剃刀（简单成就高效）；科学试错；可靠性
        exclude_routing: "\"三条边\"在工程场景中怎么把事做成 → D05-1（③），辅助标签[工程]；具体工程案例史 → X4；工程师职业分级 → D06-1"
        caliber: "三条边 = **基线、极限、连接路径**（已用谷歌第 008 封信核实，不是成本、质量、时间三角）；原理归本簇，应用归 D05-1"
        capability_tags:
          - 思
  -
    code: D05
    name: 做事方法与执行力
    category: 对外
    focus: false
    one_line_definition: 确定要做之后，怎样把事做成，并持续执行与复盘
    core_question: 我已经决定做，怎么做成、怎么坚持、怎么复盘？
    criteria_conclusion_test: "结论句回答\"确定要做之后怎么做、怎么坚持、怎么复盘\""
    neighbor_rules:
      - ①
      - ②
      - ③
      - ⑨
    l2_children:
      -
        code: D05-1
        name: 做事路径与原则
        definition: 确定要做之后，把事做成的路径与原则。问：已决定做，路径是什么、原则是什么？
        include: "三条边的应用（基线 → 极限 → 路径）；先动手还是先动脑；关键路径与替代方案；做好最后的 1%；笨办法与专注；永远寻找更好的方法；做大事与做小事的心态（做事层面）；行动与吸取教训"
        exclude_routing: 做不做、先后取舍 → D03-1；极限、误差原理 → D04-3；复盘与坚持 → D05-2；长期能力积累 → D02；职场场景化 → D06
        caliber: "结论句回答\"确定要做之后怎么做\"归本簇（①②③）"
        capability_tags:
          - 做
      -
        code: D05-2
        name: 执行与复盘
        definition: 把事持续执行下去、可叠加地进步，并复盘。问：怎样坚持执行、持续进步、做好复盘？
        include: 可重复的成功；可叠加的进步的做法；不怕慢就怕停；坚持与长期主义（执行层面）；复盘；习惯的落实（服务于具体事）；OKR 作为通用执行与复盘工具；小习惯
        exclude_routing: "习惯作为\"长期积累能力\"的论述 → D02（①）；职场目标管理的职场场景论述 → D06-2；学习方法 → D02-2"
        caliber: "结论句讲\"怎么把事持续做下去、怎么复盘\"归本簇；见 §13.4 第 7 行"
        capability_tags:
          - 做
  -
    code: D06
    name: 职业与职场
    category: 对外
    focus: true
    one_line_definition: 职业选择与发展、职场效能，以及职场中的关系与上下级
    core_question: 在职场里怎样选路、做出成果、处好关系？
    criteria_conclusion_test: "结论句\"以职业发展、职场成果或职场关系为目的\""
    neighbor_rules:
      - ⑤
      - ⑫
    l2_children:
      -
        code: D06-1
        name: 职业选择与发展
        definition: 职业选择、第一份工作、职业分级与发展路径、职业阶段与天花板。问：我的职业路怎么选、怎么走？
        include: 职业选择与第一份工作（含工资的权衡）；五级工程师与职业发展；职业员工与管理者的分工与发展；35 岁等职业阶段议题；职业天花板；量级与职业发展；帝道、王道与霸道；面试与求职；转行与行业选择（职业视角）
        exclude_routing: 升学、高考、大学选择 → X5；通用做事 → D05；企业经营 → D08；行业趋势预测 → X6 或 X2
        caliber: "结论句\"以职业发展为目的\"归本簇（⑤）"
        capability_tags:
          - 做
      -
        code: D06-2
        name: 职场效能
        definition: "在职场中把工作做出成果的方法与误区：伪工作与有效工作、目标管理、做好最后的 1%。问：怎样在职场里不做无效功、做出成果？"
        include: "伪工作者；努力 10000 小时的辨析；三板斧破四困境；OKR（职场场景）；做好最后的 1%（职场场景）；职场效率；远程办公的效率"
        exclude_routing: 通用做事路径 → D05-1；执行与复盘通则 → D05-2；职业选择 → D06-1；职场关系 → D06-3
        caliber: "与 D05 的判据是\"职场场景\"：论述明确以职场为载体归本簇，通则归 D05"
        capability_tags:
          - 做
      -
        code: D06-3
        name: 职场关系与向上管理
        definition: 职场中与上级、下属、同事的关系，以及管理者与被管理者的行为。问：在职场里怎样处好与上下级、同事的关系？
        include: 好老板；追随什么样的领导；向上管理；服从与领导；下属比自己强怎么办；识别和防范职场小人与腐食者；老板画饼的判断；职场霸凌中的关系处理
        exclude_routing: 通用沟通机制 → D07-1；合作与信任通则 → D07-2；企业组织结构与管理学 → D08
        caliber: 以职业目的的关系归本簇；一般交友与合作归 D07-2（⑤）
        capability_tags:
          - 沟
  -
    code: D07
    name: 为人处世与组织协同
    category: 对外
    focus: false
    one_line_definition: 人与人之间的沟通、合作、信任与组织协作机制
    core_question: 我怎样与他人有效沟通、合作并建立信任？
    criteria_conclusion_test: "结论句\"关于沟通方式或合作关系机制本身\""
