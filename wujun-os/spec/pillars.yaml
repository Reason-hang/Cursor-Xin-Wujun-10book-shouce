        include: 沟通的目的与有效性；沟通的带宽；讲理的方法；说服；演讲；体面地拒绝；防范沟通中的欺诈；讲逻辑地表达；与他人沟通讨论的必要性；会沟通的人的标准
        exclude_routing: 以职业发展为目的的沟通（展示价值、面试沟通、向上沟通）→ D06，加沟通标签（⑫）；合作与信任 → D07-2；学术写作规范 → X8
