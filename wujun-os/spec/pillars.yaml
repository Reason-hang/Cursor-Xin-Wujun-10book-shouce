    code: D09
    name: 财富与投资
    category: 对外
    focus: false
    one_line_definition: 个人的财富观、现金流，以及投资的原则与红线
    core_question: 我怎样看待和管理钱，怎样投资而不踩红线？
    criteria_conclusion_test: 个人资金视角
    neighbor_rules:
      - ⑥
    l2_children:
      -
        code: D09-1
        name: 财富观与现金流
        definition: 财富的含义、金钱观（财富层面）、花钱与省钱、成本、现金流与财富自由、收入来源。问：我怎样看待与管理钱？
        include: 什么是财富；贫穷与富有的态度；不乱花钱也不乱省钱；运用财富从大处着眼；懂得钱的用途与赚钱本领；金钱观；自由现金流与财富自由；积累财富的方式；收入水平的决定因素；家族财富
        exclude_routing: 投资原则与红线 → D09-2；价值观层面的人生取舍 → D02-3；企业现金流经营 → D08；宏观收入分配 → X6
        caliber: "个人资金视角归本簇（⑥）；\"金钱观\"一词按结论句判：讲钱的管理归本簇，讲价值取舍归 D02-3"
        capability_tags:

      -
        code: D09-2
        name: 投资原则与红线
        definition: 投资的原则、误区、资产配置，以及不可触碰的红线。问：怎样投资而不踩红线？
        include: 第一次投资的建议；永远不要碰的红线；投资的目的与资产配置；投资误区；不要试图战胜市场；风险投资的视角；投资品与消费品的区别；指数基金；现金与黄金的认识；好的投资人的方法；投资自己的专业
        exclude_routing: 通用止损与风险（决策层）→ D03-2；具体行情、标的、时点预测 → X2 或 X6；财富观 → D09-1
        caliber: "个人资金视角归本簇；手册只转述吴军的原著判断，**不构成投资建议**，章首加声明"
        capability_tags:

